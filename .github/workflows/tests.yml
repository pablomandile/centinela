name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # `composer setup` corre `artisan migrate --force` contra lo que dice
    # .env.example, que es MySQL. Sin este servicio el paso de Setup muere con
    # "SQLSTATE[HY000] [2002] Connection refused" y el CI ni llega a los tests,
    # aunque los tests después corran en sqlite. Ver el skill
    # `ci-linux-case-sensitivity`.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: centinela
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 8.4 y no 8.3: los paquetes de Symfony del composer.lock exigen
      # php >=8.4.1. Con 8.3 el `composer install` corta en el Setup.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Incluye `npm run build`, y eso no es opcional: sin
      # public/build/manifest.json la versión de asset de Inertia es '' y el test
      # de cabeceras pasa por el motivo equivocado.
      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
