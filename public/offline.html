<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sin conexión — Centinela</title>
    <link rel="icon" href="/icons/icon-192.png?v=1" type="image/png">
    <style>
        /*
         * Todo inline y sin depender de nada: esta página se sirve justamente cuando
         * la red no está, así que no puede pedir una hoja de estilos ni una fuente.
         */
        :root { color-scheme: dark light; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #0d0d0f;
            color: #fafafa;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            text-align: center;
        }

        .caja { max-width: 26rem; }

        h1 { font-size: 1.35rem; margin: 1rem 0 0.5rem; }

        p { color: #a1a1aa; margin: 0 0 1.5rem; }

        button {
            font: inherit;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            border: 1px solid #3f3f46;
            background: #18181b;
            color: #fafafa;
            cursor: pointer;
        }

        button:hover { background: #27272a; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="/icons/icon-192.png?v=1" alt="Centinela" width="72" height="72">

        <h1>Sin conexión</h1>

        <p>
            Centinela necesita internet para saber cómo están los sitios: lo que te
            mostraría ahora sería viejo, y en un tablero de salud eso es peor que no
            mostrar nada.
        </p>

        <button type="button" onclick="location.reload()">Volver a intentar</button>
    </div>
</body>
</html>
